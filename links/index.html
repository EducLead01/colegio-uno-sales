<style>
    /* Página de link na bio: praticamente todo o tráfego vem do app do
       Instagram, em celular. Por isso o CSS é inline e não há framework —
       menos requisição, abre mais rápido no navegador embutido do app. */
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #F5EFE7;

        font-size: 15px;

    .link:hover, .link:focus-visible {

        border-color: rgba(255,255,255,0.22);
    }
    .link:focus-visible { outline: 2px solid #E8821E; outline-offset: 3px; }
    .link svg { flex-shrink: 0; }
    .link .rotulo { flex: 1; }
    .link .sub {
        display: block;
        font-size: 12px;
        font-weight: 400;
        color: rgba(255,255,255,0.62);
        margin-top: 2px;
    }

    /* a matrícula é a ação que o colégio quer que aconteça: como agora todos
       os botões têm o mesmo azul, ela se distingue por um fio laranja da marca */
    .link--destaque { border-color: rgba(232,130,30,0.65); }

    .link--zap svg { color: #25D366; }

    .redes {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 28px;
    }
    .redes a {
        width: 46px; height: 46px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: #fff;
        border: 1.5px solid rgba(26,26,26,0.09);
        color: #1a1a1a;
        transition: transform .15s ease, border-color .2s ease;
    }
    .redes a:hover { transform: translateY(-2px); border-color: rgba(26,26,26,0.2); }
    .redes a:focus-visible { outline: 2px solid #E8821E; outline-offset: 3px; }

    .rodape {
        margin-top: 30px;
        text-align: center;
        font-size: 11.5px;
        line-height: 1.6;
        color: rgba(26,26,26,0.42);
    }

    @media (prefers-reduced-motion: reduce) {
        .link, .redes a { transition: none; }
        .link:hover, .redes a:hover { transform: none; }
    }

    /* popup de captura — só no botão de matrículas, que é quem já tem
       intenção declarada e aceita um passo a mais. O "Fale conosco" segue
       direto pro WhatsApp, pra quem só quer tirar uma dúvida rápida. */

    .modal-x { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border: 0; border-radius: 50%;

<script>
var LEADS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxuB2SU5GPoljgigDCgVC7sHblcPXHsV3PwD3VulzQtMnPJUss0I57c2-i2hHHGVXVWuw/exec';
var WHATSAPP_NUMERO = '5562999811903';

// Avisa o FunnelMax da conversão. Ele rastreia as visitas sozinho, mas o lead
// precisa ser declarado — sem isso ele não tem o que repassar pro Meta.
function rastrearLead(nome, telefone, origem) {
    try {
        if (typeof window.FunnelMax === 'undefined') return;
        if (typeof window.FunnelMax.identify === 'function') {
            window.FunnelMax.identify({ name: nome, phone: telefone });
        }
        if (typeof window.FunnelMax.track === 'function') {
            window.FunnelMax.track('Lead', { origem: origem, nome: nome, telefone: telefone });
        }
    } catch (e) {}   // rastreamento nunca pode impedir o lead de ser enviado
}

function enviarLead(dados) {
    if (!LEADS_ENDPOINT) return false;
    var corpo = JSON.stringify(dados);
    // sendBeacon sobrevive à navegação; um fetch seria cancelado no instante
    // em que o WhatsApp abre — justamente o caso mais comum aqui.
    if (navigator.sendBeacon) {
        return navigator.sendBeacon(LEADS_ENDPOINT, new Blob([corpo], { type: 'text/plain;charset=UTF-8' }));
    }
    fetch(LEADS_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: corpo,
        keepalive: true
    }).catch(function () {});
    return true;
}

(function captura() {
    var modal  = document.getElementById('modal');
    var x      = document.getElementById('modal-x');
    var form   = document.getElementById('modal-form');
    var nome   = document.getElementById('modal-nome');
    var tel    = document.getElementById('modal-tel');
    var titulo = document.getElementById('modal-titulo');
    if (!modal || !form) return;

    // Os dois botões abrem o mesmo popup; o que muda é o texto e a mensagem
    // que chega no WhatsApp. A origem é a mesma, e a coluna Detalhes separa
    // quem veio por matrículas de quem veio por contato geral.
    var CONTEXTOS = {
        'btn-matriculas': {
            titulo: 'Matrículas 2027',
            detalhes: 'Interesse em matrículas 2027',
            mensagem: function (n) {
                return 'Olá! Meu nome é ' + n + '. Vim pelo Instagram e gostaria de saber sobre as matrículas 2027.';
            }
        },
        'btn-contato': {
            titulo: 'Falar no WhatsApp',
            detalhes: 'Contato geral',
            mensagem: function (n) {
                return 'Olá! Meu nome é ' + n + ' e vim pelo Instagram do Colégio Uno Sales.';
            }
        }
    };

    var atual = CONTEXTOS['btn-matriculas'];

    function sair() { modal.hidden = true; }

    Object.keys(CONTEXTOS).forEach(function (id) {
        var b = document.getElementById(id);
        if (!b) return;
        b.addEventListener('click', function () {
            atual = CONTEXTOS[id];
            titulo.textContent = atual.titulo;
            modal.hidden = false;
            setTimeout(function () { nome.focus(); }, 60);
        });
    });

    x.addEventListener('click', sair);
    modal.addEventListener('click', function (e) { if (e.target === modal) sair(); });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !modal.hidden) sair();
    });
    [nome, tel].forEach(function (c) {
        c.addEventListener('input', function () { c.style.borderColor = ''; });
    });

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var n = nome.value.trim(), t = tel.value.trim();
        if (!n || !t) { (!n ? nome : tel).style.borderColor = '#C21233'; (!n ? nome : tel).focus(); return; }

        enviarLead({ nome: n, telefone: t, origem: 'Link da bio', detalhes: atual.detalhes });
        rastrearLead(n, t, 'Link da bio');

        // aberto de forma síncrona, ainda dentro do clique: dentro de uma
        // promise o bloqueador de pop-ups do navegador barraria a janela
        var msg = atual.mensagem(n);
        window.open('https://wa.me/' + WHATSAPP_NUMERO + '?text=' + encodeURIComponent(msg), '_blank', 'noopener');
        sair();
        form.reset();
    });
})();
</script>
